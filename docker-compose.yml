version: '3.8'

services:
  db:
    image: postgres:16.3
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: replais_user
      POSTGRES_PASSWORD: replais_password
      POSTGRES_DB: replais
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d

volumes:
  db-data: